spring.application.name=kafkaIntegrationConsumer
server.port=8082

# ===============================
# PostgreSQL
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/kafka_demo
spring.datasource.username=postgres
spring.datasource.password=1998
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ===============================
# Kafka
# ===============================
spring.kafka.bootstrap-servers=localhost:9092

# ===============================
# Consumer
# ===============================
spring.kafka.consumer.group-id=order-consumer-debug
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# ===============================
# JSON Deserialization
# ===============================

# Do NOT use the Java class information sent by the producer
spring.kafka.consumer.properties.spring.json.use.type.headers=false

# Consumer's own event class
spring.kafka.consumer.properties.spring.json.value.default.type=com.kgstrivers.kafkaIntegrationConsumer.Events.OrderCreatedEvent

# Trust the consumer event package
spring.kafka.consumer.properties.spring.json.trusted.packages=com.kgstrivers.kafkaIntegrationConsumer.Events